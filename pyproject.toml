[project]
name = "atp-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1",
  "livekit-agents[elevenlabs]>=1.2,<2", "livekit-api>=1,<2",
  "openai>=1.100,<3", "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
